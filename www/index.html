else if(a=='delcat'){S.cats=S.cats||CATS.slice();if(S.cats.length>1)S.cats.splice(+v,1)}
else if(a=='clr'){if(!S.sure){S.sure=1;toast('Toque de novo para confirmar')}else{S.tasks=[];S.habits=[];S.events=[];S.care=[];S.sure=0}}
else if(a=='mood')S.mood[today()]=v;
else if(a=='newexp')return form('Nova vivência',[{k:'t',l:'O que você viveu?'},{k:'d',l:'Como foi? (opcional)'},{k:'date',l:'Data',type:'date',v:today()}],v=>{S.exp.push({id:uid(),t:v.t,d:v.d,date:v.date||today()});if(S.exp.filter(e=>e.date==today()).length<=3)xp(10,'Vivência')});
else if(a=='delexp')S.exp=S.exp.filter(x=>x.id!=id);
else if(a=='sub')S.sub=v;
else if(a=='newgoal')return form('Nova meta',[{k:'t',l:'Meta ou projeto'},{k:'why',l:'Por que isso importa?'},{k:'st',l:'Etapas (separe por vírgula)'},{k:'due',l:'Prazo (opcional)',type:'date'}],v=>S.goals.push({id:uid(),t:v.t,why:v.why,due:v.due,steps:stp(v.st)}));
else if(a=='delgoal'){S.goals=S.goals.filter(g=>g.id!=id);S.tasks.forEach(t=>{if(t.goal==id)t.goal=''})}
else if(a=='gstep'){const x=S.goals.find(g=>g.id==id).steps[+v];x.d=!x.d;if(x.d&&!x.x){x.x=1;xp(5)}}
else if(a=='addgs'){const i=$('#gs'+id),g=S.goals.find(g=>g.id==id);if(i.value.trim())g.steps.push({t:i.value.trim(),d:false})}
else if(a=='rv'){if(v=='x')S.tasks=S.tasks.filter(x=>x.id!=id);else{const t=T(id),d=new Date();d.setDate(d.getDate()+((8-d.getDay())%7||7));t.due=iso(d);t.start=t.due;t.rs=(t.rs||0)+1}}
else if(a=='revdone'){const wn=Math.floor((Math.floor(new Date(today()).getTime()/864e5)+3)/7),wv=$('#win');if(wv&&wv.value.trim()){S.wins=S.wins||[];S.wins.push({d:today(),t:wv.value.trim()})}if(S.lastrev!=wn){S.lastrev=wn;S.n.rev++;xp(15,'Revisão feita')}S.sub='menu'}
else if(a=='setname'){S.name=$('#nm').value.trim();toast('Salvo')}
else if(a=='theme'){S.theme=v;applyTheme()}
else if(a=='imp'){try{const o=JSON.parse($('#bk').value);if(o&&o.tasks){S=o;S.n=S.n||{};S.n.rev=S.n.rev||0;S.goals=S.goals||[];S.exp=S.exp||[];S.mood=S.mood||{};S.cards=S.cards||{};S.trips=S.trips||[];S.lv=S.lv||1;applyTheme();toast('Importado')}}catch(x){toast('Texto inválido')}}
else if(a=='editcare'){const x=S.care.find(x=>x.id==id);return form('Editar rotina',[{k:'t',l:'Nome',v:E(x.t)},{k:'dur',l:'Duração (min)',type:'number',v:x.dur},{k:'st',l:'Etapas (separe por vírgula)',v:E(x.steps.map(s=>s.t).join(', '))}],v=>{x.t=v.t;x.dur=+v.dur||x.dur;const old=x.steps;x.steps=v.st.split(',').map(s=>s.trim()).filter(Boolean).map(t=>old.find(s=>s.t==t)||{t,d:false})})}
else if(a=='delcare')S.care=S.care.filter(x=>x.id!=id);
else if(a=='cstep'){const x=S.care.find(x=>x.id==id),s=x.steps[+v];s.d=!s.d;if(x.steps.every(s=>s.d)&&x.st!='concluido'){x.st='concluido';if(x.xd!=today()){x.xd=today();S.n.care++;xp(15,'Rotina completa')}}else if(s.d&&!s.x){s.x=1;xp(2)}}
else if(a=='ctoday'){const x=S.care.find(x=>x.id==id);return form('Agendar '+E(x.t),[{k:'time',l:'Horário',type:'time',v:'18:00'},{k:'rep',l:'Repetir',o:REP}],v=>{S.events.push({id:uid(),t:'🧴 '+x.t,day:today(),time:v.time,dur:x.dur,free:true,rep:v.rep});toast('Agendado')})}
else if(a=='buyr'){const r=ROUTINES.find(x=>x.id==id);if(coins()<r.p){toast('Moedas insuficientes');return}S.spent+=r.p;S.own.push('rot:'+id);S.care.push({id:uid(),k:'cuidado',t:r.n,dur:r.dur,st:'quero',steps:r.steps.map(t=>({t,d:false}))});toast('Rotina adicionada ao Meu cuidado');render();return openShop()}
else if(a=='shop')return openShop(v);
else if(a=='buy'||a=='use'){const[k,i]=id.split(':'),it=(k=='pal'?THEMES:CARDS).find(x=>x.id==i);if(a=='buy'){if(coins()<it.p){toast('Moedas insuficientes');return}S.spent+=it.p;S.own.push(id)}S[k]=i;applyTheme();render();return openShop()}
else if(a=='redeem'){const m=S.mimos.find(x=>x.id==id);if(coins()<m.p){toast('Moedas insuficientes');return}S.spent+=m.p;S.events.push({id:uid(),t:'🎁 '+m.t,day:today(),time:'',free:true});S.n.care++;checkAch();toast('Aproveite! Já está no seu dia');render();return openShop()}
else if(a=='newmimo')return form('Novo mimo',[{k:'t',l:'Mimo'},{k:'p',l:'Preço em moedas',type:'number',v:20}],v=>{S.mimos.push({id:uid(),t:v.t,p:Math.max(1,+v.p||20)});setTimeout(()=>openShop('mimos'),0)});
else if(a=='delmimo'){S.mimos=S.mimos.filter(x=>x.id!=id);render();return openShop()}
else if(a=='sug'){const m=+$('#fm').value;const r=S.care.filter(x=>x.st!='concluido'&&x.dur<=m);$('#sg').innerHTML=r.length?r.map(x=>'• '+E(x.t)+' ('+x.dur+' min)').join('<br>'):'Nada na biblioteca cabe nesse tempo. Descansar também vale.';return}
render()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('#md').innerHTML)render()});
addEventListener('visibilitychange',()=>{if(!document.hidden&&AC.uid&&Date.now()-(AC.last||0)>6e4)pull().catch(()=>{})});if(AC.uid)setTimeout(()=>pull().catch(()=>{}),1500);
$('#fi').onchange=e=>{const f=e.target.files[0],x=S.care.find(x=>x.id==S.imgFor);e.target.value='';if(!f||!x)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,260/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',.7);if(JSON.stringify(S).length+u.length>4e6){toast('Sem espaço para mais imagens');return}x.img=u;render()};im.src=r.result};r.readAsDataURL(f)};
render();if(!S.onb)welcome();if(LN)setTimeout(reschedule,800);
</script>
